<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa en vivo de tu zona · NearMe</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  html,body{margin:0;padding:0;height:100%;font-family:-apple-system,system-ui,sans-serif;}
  #map{height:calc(100% - 30px);width:100%;}
  .credit{height:30px;background:#0B0F17;color:#9aa7b8;display:flex;align-items:center;justify-content:center;font-size:11px;gap:4px;}
  .credit a{color:#67E8F9;text-decoration:none;font-weight:600;}
  .credit a:hover{text-decoration:underline;}
  .pop-title{font-weight:700;font-size:13px;margin-bottom:2px;}
  .pop-src{font-size:11px;color:#555;}
  .legend{position:absolute;top:10px;left:10px;z-index:1000;background:rgba(255,255,255,.92);border-radius:8px;padding:8px 10px;font-size:11px;box-shadow:0 1px 4px rgba(0,0,0,.15);max-width:190px;}
  .legend .lg-title{font-weight:700;margin-bottom:4px;}
  .legend .lg-row{display:flex;align-items:center;gap:6px;margin:2px 0;color:#333;}
  .legend .lg-dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #fff;}
</style>
</head>
<body>
<div id="map"></div>
<div class="legend" id="legend" hidden></div>
<div class="credit">
  <span>Datos en vivo de tu zona ·</span>
  <a href="https://nearme.viajeinteligencia.com" target="_blank" rel="noopener">NearMe · viajeinteligencia.com</a>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var lat = parseFloat(q.get('lat')) || 40.42;
  var lon = parseFloat(q.get('lon')) || -3.70;
  var radius = parseFloat(q.get('radius')) || 30;  // km
  var map = L.map('map', { zoomControl: false }).setView([lat, lon], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  var TYPE_LABEL = {
    road_incident: 'Tráfico', traffic: 'Tráfico', accident: 'Accidente',
    weather: 'Meteo', heatwave: 'Ola de calor', rain: 'Lluvia',
    fire: 'Incendio', incendio: 'Incendio',
    reservoir: 'Embalse', embalse: 'Embalse',
    air_quality: 'Calidad del aire', air: 'Calidad del aire',
    warning: 'Aviso', aviso: 'Aviso', avisos: 'Aviso',
    earthquake: 'Sismo', quake: 'Sismo', seismic: 'Sismo',
    beach: 'Playas', uv: 'UV', energy: 'Energía', train: 'Tren', renfe: 'Tren'
  };
  function typeLabel(t){
    var k = (t || '').toLowerCase();
    for (var key in TYPE_LABEL) { if (k.indexOf(key) !== -1) return TYPE_LABEL[key]; }
    return t || 'Evento';
  }
  function typeColor(t){
    var k = (t || '').toLowerCase();
    if (k.indexOf('road') !== -1 || k.indexOf('traffic') !== -1 || k.indexOf('accident') !== -1) return '#2563eb';  // azul
    if (k.indexOf('fire') !== -1 || k.indexOf('incendio') !== -1) return '#dc2626';                                // rojo
    if (k.indexOf('heat') !== -1 || k.indexOf('warning') !== -1 || k.indexOf('avis') !== -1) return '#ea580c';    // naranja
    if (k.indexOf('weather') !== -1 || k.indexOf('rain') !== -1 || k.indexOf('uv') !== -1) return '#06b6d4';      // cian
    if (k.indexOf('reservoir') !== -1 || k.indexOf('embalse') !== -1) return '#16a34a';                           // verde
    if (k.indexOf('air') !== -1) return '#9333ea';                                                                // morado
    if (k.indexOf('quake') !== -1 || k.indexOf('seismic') !== -1) return '#92400e';                               // marrón
    if (k.indexOf('beach') !== -1 || k.indexOf('playa') !== -1) return '#0d9488';                                 // teal
    return '#475569';                                                                                             // gris
  }

  // Carga según el área visible: al hacer zoom/pan recalcula el radio y recarga
  var layer = L.layerGroup().addTo(map);
  var currentRadius = radius;
  var loading = false;
  var pending = false;
  var tmr = null;

  function viewRadiusKm(){
    var b = map.getBounds();
    var c = map.getCenter();
    return Math.max(Math.min(c.distanceTo(b.getNorthEast()) / 1000 * 1.2, 200), radius);
  }

  function loadEvents(){
    if (loading) { pending = true; return; }
    loading = true;
    var c = map.getCenter();
    var r = Math.round(currentRadius);
    fetch('/api/nearby?lat=' + c.lat.toFixed(5) + '&lon=' + c.lng.toFixed(5) + '&radius_km=' + r)
      .then(function(res){ return res.json(); })
      .then(function(d){
        layer.clearLayers();
        var evs = (d && d.events) || [];
        var legend = {}, seen = {};
        evs.forEach(function(e){
          var t = e.event_type || 'evento';
          var color = typeColor(t);
          var label = typeLabel(t);
          if (!seen[t]) { seen[t] = 1; legend[label] = color; }
          var dx = (Math.random() - 0.5) * 0.0012;
          var dy = (Math.random() - 0.5) * 0.0012;
          L.circleMarker([e.lat + dy, e.lon + dx], {
            radius: 7, color: '#fff', weight: 1.5, fillColor: color, fillOpacity: 0.85
          }).bindPopup(
            '<div class="pop-title">' + (e.title || label || '') + '</div>' +
            '<div class="pop-src">' + (e.source || '') + ' · ' + (e.level || '') + '</div>'
          ).addTo(layer);
        });
        var legKeys = Object.keys(legend);
        var lg = document.getElementById('legend');
        if (legKeys.length) {
          lg.innerHTML = '<div class="lg-title">Eventos (' + evs.length + ')</div>' +
            legKeys.map(function(k){ return '<div class="lg-row"><span class="lg-dot" style="background:' + legend[k] + '"></span>' + k + '</div>'; }).join('');
          lg.hidden = false;
        } else { lg.hidden = true; }
        loading = false;
        if (pending) { pending = false; loadEvents(); }
      }).catch(function(){ loading = false; });
  }

  map.on('moveend zoomend', function(){
    var nr = viewRadiusKm();
    if (Math.abs(nr - currentRadius) > 3) { currentRadius = nr; }
    clearTimeout(tmr);
    tmr = setTimeout(loadEvents, 400);
  });

  loadEvents();
})();
</script>
</body>
</html>
